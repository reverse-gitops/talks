apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderer
spec:
  template:
    spec:
      containers:
      - name: orderer
        image: ghcr.io/stroopwafel/orderer:1.4
        volumeMounts:
        - name: config
          mountPath: /etc/orderer/config
      volumes:
      - name: config
        image:  # a container image as a volume
          reference: ghcr.io/stroopwafel/orderer-config:43@sha256:90df… # {"$imagepolicy": "flux:config"}
          pullPolicy: IfNotPresent
