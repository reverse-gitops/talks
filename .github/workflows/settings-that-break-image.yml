# Builds the Settings That Break Production deck as an nginx image and pushes it to GHCR, for
# hosting at https://demo.koudijs.dev/dcnd-2026/ (or another path via the manual run).
name: settings-that-break image

on:
  push:
    branches: [main]
    paths:
      - settings-that-break/**
      - tools/slidev-addon-web-terminal/**
      - .github/workflows/settings-that-break-image.yml
  pull_request:
    paths:
      - settings-that-break/**
      - tools/slidev-addon-web-terminal/**
      - .github/workflows/settings-that-break-image.yml
  workflow_dispatch:
    inputs:
      base_path:
        description: Path the deck is served under, with leading and trailing slash
        default: /dcnd-2026/
        required: true

concurrency:
  group: settings-that-break-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/settings-that-break
  BASE_PATH: ${{ inputs.base_path || '/dcnd-2026/' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The path is baked into the image. Default-path builds on main get latest and sha-<sha>;
      # a manual run with another path only gets custom-<run number>, so it never replaces latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && env.BASE_PATH == '/dcnd-2026/' }}
            type=sha,prefix=sha-,format=short,enable=${{ env.BASE_PATH == '/dcnd-2026/' }}
            type=raw,value=custom-${{ github.run_number }},enable=${{ env.BASE_PATH != '/dcnd-2026/' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: settings-that-break/Dockerfile
          build-args: BASE_PATH=${{ env.BASE_PATH }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### settings-that-break image"
            echo "Served under \`${BASE_PATH}\` on port 8080 (health check: \`/healthz\`)."
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
